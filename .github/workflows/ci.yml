name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch upstream changes (Omarchy theme layout, release asset names)
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: for f in install.sh capture.sh gsettings/*.sh tests/*.sh tests/vm/guest/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck install.sh capture.sh gsettings/*.sh tests/*.sh tests/vm/guest/*.sh config/bash/omarchy-style.sh
      - name: py_compile
        run: |
          python3 -m py_compile bin/pantheme temas/matrix/animado tests/vm/*.py
          python3 bin/pantheme --help > /dev/null

  smoke:
    # Steps that don't need a desktop session, in a throwaway Ubuntu 24.04
    # (the base of elementary OS 8): install, check, reinstall, uninstall.
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: smoke test
        run: bash tests/smoke.sh
