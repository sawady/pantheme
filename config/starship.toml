"$schema" = 'https://starship.rs/config-schema.json'
palette = "tema"

format = """
[░▒▓](seg1)\
$os\
[](bg:seg2 fg:seg1)\
$directory\
[](fg:seg2 bg:seg3)\
$git_branch\
$git_status\
[](fg:seg3 bg:seg4)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:seg4 bg:seg5)\
$time\
[ ](fg:seg5)\
\n$character"""

[directory]
style = "fg:txt_light bg:seg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:seg3"
format = '[[ $symbol $branch ](fg:seg2 bg:seg3)]($style)'

[git_status]
style = "bg:seg3"
format = '[[($all_status$ahead_behind )](fg:seg2 bg:seg3)]($style)'

[nodejs]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol ($version) ](fg:seg2 bg:seg4)]($style)'

[bun]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol ($version) ](fg:seg2 bg:seg4)]($style)'

[rust]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol ($version) ](fg:seg2 bg:seg4)]($style)'

[golang]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol ($version) ](fg:seg2 bg:seg4)]($style)'

[php]
symbol = ""
style = "bg:seg4"
format = '[[ $symbol ($version) ](fg:seg2 bg:seg4)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:seg5"
format = '[[  $time ](fg:txt_muted bg:seg5)]($style)'

[os]
style = "bg:seg1 fg:txt_dark"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Elementary = "😎"
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# Generado por `tema` — no editar a mano
[palettes.tema]
seg1 = "#5cff7f"
seg2 = "#00ff41"
seg3 = "#1f5f2a"
seg4 = "#0f1f12"
seg5 = "#050104"
txt_dark = "#000000"
txt_light = "#0d0208"
txt_muted = "#00ff41"
